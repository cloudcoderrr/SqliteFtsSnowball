name: build-nuget

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Fetch & patch Snowball C# sources
        shell: pwsh
        run: ./scripts/fetch-snowball.ps1

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v', ''
          } else {
            $v = "0.1.0-ci.$($env:GITHUB_RUN_NUMBER)"
          }
          Write-Host "version=$v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Pack
        run: >
          dotnet pack src/SqliteFtsSnowball/SqliteFtsSnowball.csproj
          -c Release
          -p:Version=${{ steps.ver.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -o artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          artifacts/*.nupkg artifacts/*.snupkg
          --title "SqliteFtsSnowball ${{ github.ref_name }}"
          --generate-notes
