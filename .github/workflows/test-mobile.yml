name: test-mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  MAUI_PROJECT: Tests/Mobile/SnowballTests.Mobile.Maui/SnowballTests.Mobile.Maui.csproj
  BUNDLE_ID: com.sqlitefts.snowball.tests

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch & patch Snowball C# sources
        shell: pwsh
        run: ./scripts/fetch-snowball.ps1

      - name: Install MAUI Android workload
        run: dotnet workload restore ${{ env.MAUI_PROJECT }}

      - name: Build APK
        run: dotnet build ${{ env.MAUI_PROJECT }} -f net10.0-android -c Debug -p:EmbedAssembliesIntoApk=true -p:RuntimeIdentifier=android-x64

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-android.sh

      - name: Upload Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-android
          path: mobile-logs/**
          if-no-files-found: warn

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch & patch Snowball C# sources
        shell: pwsh
        run: ./scripts/fetch-snowball.ps1

      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios maui-maccatalyst --skip-manifest-update

      - name: Select Xcode matching the .NET iOS workload
        run: |
          echo 'Available Xcodes:'; ls -d /Applications/Xcode_*.app || true
          XC=$(ls -d /Applications/Xcode_26.0.[0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_26.0*.app 2>/dev/null | sort -V | tail -1); fi
          echo "Selecting: $XC"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          ls "$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs/" || true

      - name: Download iOS Simulator runtime
        timeout-minutes: 30
        run: |
          echo 'Runtimes before:'; xcrun simctl list runtimes || true
          ok=0
          for i in 1 2 3 4; do
            if sudo xcodebuild -downloadPlatform iOS; then ok=1; break; fi
            echo "download attempt $i failed; retrying in 30s"; sleep 30
          done
          echo 'Runtimes after:'; xcrun simctl list runtimes || true
          if [ "$ok" != "1" ]; then echo 'Failed to download iOS runtime after retries'; exit 1; fi

      - name: Build for iOS Simulator
        run: dotnet build ${{ env.MAUI_PROJECT }} -f net10.0-ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64

      - name: Run tests on iOS Simulator
        timeout-minutes: 15
        run: bash .github/scripts/run-ios.sh

      - name: Upload iOS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-ios
          path: mobile-logs/**
          if-no-files-found: warn

  maccatalyst:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch & patch Snowball C# sources
        shell: pwsh
        run: ./scripts/fetch-snowball.ps1

      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios maui-maccatalyst --skip-manifest-update

      - name: Select Xcode matching the .NET iOS workload
        run: |
          echo 'Available Xcodes:'; ls -d /Applications/Xcode_*.app || true
          XC=$(ls -d /Applications/Xcode_26.0.[0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_26.0*.app 2>/dev/null | sort -V | tail -1); fi
          echo "Selecting: $XC"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          ls "$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs/" || true

      - name: Build Mac Catalyst app
        run: dotnet build ${{ env.MAUI_PROJECT }} -f net10.0-maccatalyst -c Debug -p:RuntimeIdentifier=maccatalyst-arm64

      - name: Run Mac Catalyst tests
        timeout-minutes: 15
        run: bash .github/scripts/run-maccatalyst.sh

      - name: Upload Mac Catalyst logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-maccatalyst
          path: mobile-logs/**
          if-no-files-found: warn
